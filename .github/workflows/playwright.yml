name: E2E

on:
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Test
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.33.0-jammy
    steps:
      - name: Get preview link
        uses: zentered/vercel-preview-url@v1.1.9
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_WEB_ID }}

      - name: Checkout 🛎️
        uses: actions/checkout@v2

      - name: Setup node and npm
        uses: actions/setup-node@v3
        with:
          cache: npm
          node-version: '22.14.0'
          cache-dependency-path: 'package-lock.json'

      - name: Install npm dependencies
        run: 'npm ci --ignore-scripts'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Awaiting WEB deployment to be ready
        uses: UnlyEd/github-action-await-vercel@v1.1.1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEl_TOKEN }}
        with:
          deployment-url: ${{ steps.build.outputs.preview_url }}
          timeout: 600

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        env:
          CI: true
          URL: https://${{ steps.build.outputs.preview_url }}
          RPC_URL: ${{ secrets.RPC_URL }}
          WITH_ANVIL: true
          GUARDIAN_UI_INFURA_API_KEY: 84842078b09946638c03157f83405213
          GUARDIAN_UI_ALCHEMY_API_KEY: _gg7wSSi0KMBsdKnGVfHDueq6xMB9EkC
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: web-desktop
          path: ./e2e/playwright-report/
          retention-days: 3
